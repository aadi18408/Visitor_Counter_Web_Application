
services:
  redis:
    image: redis:7-alpine
    container_name: visitor-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  web:
    build: .
    container_name: visitor-web
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

volumes:
  redis-data:
